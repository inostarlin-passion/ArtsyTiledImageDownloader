name: Artsy live download

on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Direct and tiled image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download and decode both paths
        env:
          RUN_LIVE_TESTS: "1"
        run: python -m pytest tests/test_live_download.py
